steps:
  # 1. Install dependencies and build React application
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'build']
  
  # 2. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/sandip-cloud-portfolio/portfolio-repo/portfolio-site:$BUILD_ID'
      - '.'

  # 3. Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/sandip-cloud-portfolio/portfolio-repo/portfolio-site:$BUILD_ID'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'portfolio-site'
      - '--image'
      - 'us-central1-docker.pkg.dev/sandip-cloud-portfolio/portfolio-repo/portfolio-site:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
 - 'us-central1-docker.pkg.dev/sandip-cloud-portfolio/portfolio-repo/portfolio-site:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY